name: Update portfolio video titles

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-portfolio-video-titles.yml'

permissions:
  contents: write

jobs:
  update-titles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Vimeo titles and update portfolio page
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, urllib.parse, urllib.request, re

          ids = ['477464504','477465575','769314108','559436214','559436529','559435064']
          titles = {}
          for vid in ids:
              url = 'https://vimeo.com/api/oembed.json?' + urllib.parse.urlencode({'url': f'https://vimeo.com/{vid}'})
              with urllib.request.urlopen(url, timeout=20) as r:
                  data = json.load(r)
              titles[vid] = data.get('title','').strip()
              print(vid, titles[vid])

          # Identify Jim Hanson video from Vimeo title and override exactly as requested.
          jim_ids = [vid for vid, title in titles.items() if 'jim hanson' in title.lower() or 'hanson' in title.lower()]
          if len(jim_ids) != 1:
              raise SystemExit(f'Expected exactly one Jim Hanson video, found {jim_ids} with titles {titles}')
          titles[jim_ids[0]] = 'NDP - Jim Hanson and Jagmeet Saingh'

          p = Path('education-public-sector/index.html')
          text = p.read_text()

          # Replace the public affairs video headings in order.
          public_ids = ['477464504','477465575','769314108']
          current_public = [
              'Selected Public Affairs Video 01',
              'Selected Public Affairs Video 02',
              'Video title loading…'
          ]
          for vid, old in zip(public_ids, current_public):
              new = titles[vid]
              text, n = re.subn(r'(<h3(?: id="public-title-3")? class="section-title" style="font-size:clamp\(2rem,3\.5vw,3\.4rem\)">)' + re.escape(old) + r'(</h3>)', lambda m: m.group(1)+new+m.group(2), text, count=1)
              if n != 1:
                  raise SystemExit(f'Could not replace public title for {vid}: {old}')

          # Replace Burnaby School District headings in order with actual Vimeo titles.
          education_ids = ['559436214','559436529','559435064']
          for idx, vid in enumerate(education_ids, 1):
              old = f'Burnaby School District Story 0{idx}'
              new = titles[vid]
              text, n = re.subn(r'(<h3 class="section-title" style="font-size:clamp\(2rem,3\.5vw,3\.4rem\)">)' + re.escape(old) + r'(</h3>)', lambda m: m.group(1)+new+m.group(2), text, count=1)
              if n != 1:
                  raise SystemExit(f'Could not replace education title for {vid}: {old}')

          # Remove Vimeo title-loader JS now that all titles are static.
          text = text.replace('<script src="https://player.vimeo.com/api/player.js"></script><script>(function(){var iframe=document.getElementById("public-video-3");var title=document.getElementById("public-title-3");if(!iframe||!title||!window.Vimeo)return;var player=new Vimeo.Player(iframe);player.getVideoTitle().then(function(videoTitle){if(videoTitle)title.textContent=videoTitle;}).catch(function(){title.textContent="Public Affairs & Political Communications";});})();</script>', '')
          text = text.replace(' id="public-video-3"', '')
          text = text.replace(' id="public-title-3"', '')

          p.write_text(text)
          print('Final titles:', titles)
          PY
      - name: Commit updated titles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add education-public-sector/index.html
          git commit -m "Use actual Vimeo titles across public sector portfolio"
          git push
