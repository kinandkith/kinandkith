name: Add construction portfolio page

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-construction-page.yml'

permissions:
  contents: write

jobs:
  update-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update portfolio site
        run: |
          python - <<'PY'
          from pathlib import Path

          root_nav_old = '<a class="nav-link" href="martial-arts/">Martial Arts</a><a class="nav-link" href="business-healthcare/">Business & Healthcare</a><a class="nav-link" href="about/">About</a>'
          root_nav_new = '<a class="nav-link" href="martial-arts/">Martial Arts</a><a class="nav-link" href="business-healthcare/">Business & Healthcare</a><a class="nav-link" href="construction-projects/">Construction</a><a class="nav-link" href="about/">About</a>'
          sub_nav_old = '<a class="nav-link" href="../martial-arts/">Martial Arts</a><a class="nav-link" href="../business-healthcare/">Business & Healthcare</a><a class="nav-link" href="../about/">About</a>'
          sub_nav_new = '<a class="nav-link" href="../martial-arts/">Martial Arts</a><a class="nav-link" href="../business-healthcare/">Business & Healthcare</a><a class="nav-link" href="../construction-projects/">Construction</a><a class="nav-link" href="../about/">About</a>'

          # Navigation across existing pages
          p = Path('index.html')
          text = p.read_text()
          text = text.replace(root_nav_old, root_nav_new)
          p.write_text(text)

          for fn in ['martial-arts/index.html','business-healthcare/index.html','about/index.html','contact/index.html']:
              p = Path(fn)
              text = p.read_text()
              text = text.replace(sub_nav_old, sub_nav_new)
              p.write_text(text)

          # Add public affairs + education work to Business & Healthcare page.
          p = Path('business-healthcare/index.html')
          text = p.read_text()
          marker = '<section class="section section-dark"><div class="container"><div class="eyebrow">Who we help</div>'
          addition = '''<section class="section pt-0"><div class="container"><div class="eyebrow">Public Affairs & Campaign Communications</div><h2 class="section-title mb-3">Stories for public-facing campaigns.</h2><p class="lead-copy mb-5">Campaign and public affairs work that combines clear messaging, interviews and visual storytelling for audiences beyond the organization.</p><div class="row g-4"><div class="col-lg-4"><div class="ratio ratio-16x9"><iframe src="https://player.vimeo.com/video/477464504" title="NDP campaign communications example 1" allowfullscreen style="border:0;border-radius:22px;"></iframe></div><h3 class="mt-3" style="font-size:1.25rem;">Campaign Story 01</h3><p class="muted">Public affairs and campaign communications.</p></div><div class="col-lg-4"><div class="ratio ratio-16x9"><iframe src="https://player.vimeo.com/video/477465575" title="NDP campaign communications example 2" allowfullscreen style="border:0;border-radius:22px;"></iframe></div><h3 class="mt-3" style="font-size:1.25rem;">Campaign Story 02</h3><p class="muted">Message-driven video created for a public audience.</p></div><div class="col-lg-4"><div class="ratio ratio-16x9"><iframe src="https://player.vimeo.com/video/769314108" title="NDP campaign communications example 3" allowfullscreen style="border:0;border-radius:22px;"></iframe></div><h3 class="mt-3" style="font-size:1.25rem;">Campaign Story 03</h3><p class="muted">Strategic campaign storytelling and communications.</p></div></div></div></section><section class="section pt-0"><div class="container"><div class="eyebrow">Education & Public Sector</div><h2 class="section-title mb-3">Stories that make programs and people visible.</h2><p class="lead-copy mb-5">Video content created for Burnaby School District, designed to communicate programs, experiences and community stories in a clear and human way.</p><div class="row g-4"><div class="col-lg-4"><div class="ratio ratio-16x9"><iframe src="https://player.vimeo.com/video/559436214" title="Burnaby School District video example 1" allowfullscreen style="border:0;border-radius:22px;"></iframe></div><h3 class="mt-3" style="font-size:1.25rem;">Burnaby School District 01</h3></div><div class="col-lg-4"><div class="ratio ratio-16x9"><iframe src="https://player.vimeo.com/video/559436529" title="Burnaby School District video example 2" allowfullscreen style="border:0;border-radius:22px;"></iframe></div><h3 class="mt-3" style="font-size:1.25rem;">Burnaby School District 02</h3></div><div class="col-lg-4"><div class="ratio ratio-16x9"><iframe src="https://player.vimeo.com/video/559435064" title="Burnaby School District video example 3" allowfullscreen style="border:0;border-radius:22px;"></iframe></div><h3 class="mt-3" style="font-size:1.25rem;">Burnaby School District 03</h3></div></div></div></section>'''
          if 'Public Affairs & Campaign Communications' not in text:
              text = text.replace(marker, addition + marker)
          p.write_text(text)

          # New construction portfolio page. The repeated Vimeo 478678831 link is intentionally shown once.
          Path('construction-projects').mkdir(exist_ok=True)
          construction = '''<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="Kith & Kin Creative — construction, infrastructure and project storytelling for organizations and project teams."><title>Construction & Projects | Kith & Kin Creative</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="../assets/styles.css"></head><body><nav class="navbar navbar-expand-lg site-nav"><div class="container"><a href="../" class="brand"><img src="../assets/logo.svg" alt="Kith & Kin Creative logo"><span class="brand-copy">KITH & KIN<span>CREATIVE</span></span></a><button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"><span class="navbar-toggler-icon"></span></button><div class="collapse navbar-collapse justify-content-end" id="mainNav"><div class="navbar-nav"><a class="nav-link" href="../martial-arts/">Martial Arts</a><a class="nav-link" href="../business-healthcare/">Business & Healthcare</a><a class="nav-link" href="../construction-projects/">Construction</a><a class="nav-link" href="../about/">About</a><a class="nav-link" href="../contact/">Contact</a></div></div></div></nav><main><section class="hero"><div class="container"><div class="eyebrow">Construction & Related Projects</div><h1 class="display-title">Show the work. Explain the impact.</h1><p class="lead-copy">Story-driven video for construction, infrastructure and major projects—from milestones and progress updates to the people, partnerships and purpose behind the work.</p><a class="btn-main mt-4" href="../contact/">Discuss a project</a></div></section><section class="section pt-0"><div class="container"><div class="eyebrow">Portfolio</div><h2 class="section-title mb-5">Project stories in motion.</h2><div class="row g-5 align-items-center mb-5 pb-lg-5"><div class="col-lg-7"><div class="ratio ratio-16x9"><iframe src="https://player.vimeo.com/video/478678831" title="Construction project video 1" allowfullscreen style="border:0;border-radius:22px;"></iframe></div></div><div class="col-lg-5"><h3 class="section-title" style="font-size:clamp(2rem,3.5vw,3.4rem)">Construction Project Story 01</h3><p class="lead-copy">Visual storytelling that helps audiences understand the scale, progress and people behind a project.</p></div></div><div class="row g-5 align-items-center mb-5 pb-lg-5"><div class="col-lg-5 order-2 order-lg-1"><h3 class="section-title" style="font-size:clamp(2rem,3.5vw,3.4rem)">Construction Project Story 02</h3><p class="lead-copy">Project communications designed to turn technical work and important milestones into accessible stories.</p></div><div class="col-lg-7 order-1 order-lg-2"><div class="ratio ratio-16x9"><iframe src="https://player.vimeo.com/video/547668764" title="Construction project video 2" allowfullscreen style="border:0;border-radius:22px;"></iframe></div></div></div><div class="row g-5 align-items-center mb-5 pb-lg-5"><div class="col-lg-7"><div class="ratio ratio-16x9"><iframe src="https://player.vimeo.com/video/547662558" title="Construction project video 3" allowfullscreen style="border:0;border-radius:22px;"></iframe></div></div><div class="col-lg-5"><h3 class="section-title" style="font-size:clamp(2rem,3.5vw,3.4rem)">Construction Project Story 03</h3><p class="lead-copy">A clear, human way to communicate work that is often complex, technical and highly collaborative.</p></div></div><div class="row g-5 align-items-center mb-5 pb-lg-5"><div class="col-lg-5 order-2 order-lg-1"><h3 class="section-title" style="font-size:clamp(2rem,3.5vw,3.4rem)">Construction Project Story 04</h3><p class="lead-copy">Capturing project activity, expertise and progress for stakeholders, teams and the wider community.</p></div><div class="col-lg-7 order-1 order-lg-2"><div class="ratio ratio-16x9"><iframe src="https://player.vimeo.com/video/527985442" title="Construction project video 4" allowfullscreen style="border:0;border-radius:22px;"></iframe></div></div></div><div class="row g-5 align-items-center"><div class="col-lg-7"><div class="ratio ratio-16x9"><iframe src="https://player.vimeo.com/video/523002550" title="Construction project video 5" allowfullscreen style="border:0;border-radius:22px;"></iframe></div></div><div class="col-lg-5"><h3 class="section-title" style="font-size:clamp(2rem,3.5vw,3.4rem)">Construction Project Story 05</h3><p class="lead-copy">Video that documents milestones while giving audiences a reason to care about what is being built and why.</p></div></div></div></section><section class="section section-dark"><div class="container"><div class="eyebrow">What we create</div><h2 class="section-title">Project communications with a human focus.</h2><div class="row g-4 mt-5"><div class="col-md-3"><h4>Milestones</h4><p class="text-white-50">Major lifts, openings, topping out, installations and other defining project moments.</p></div><div class="col-md-3"><h4>Progress Updates</h4><p class="text-white-50">Clear visual updates for internal teams, stakeholders and community audiences.</p></div><div class="col-md-3"><h4>People & Partners</h4><p class="text-white-50">Profiles that show the expertise, collaboration and people behind the build.</p></div><div class="col-md-3"><h4>Project Stories</h4><p class="text-white-50">Longer-form storytelling that explains the purpose and impact behind the work.</p></div></div></div></section><section class="quote-strip"><div class="container"><p>Complex projects become easier to understand when people can see the story behind the work.</p></div></section><section class="section"><div class="container d-lg-flex justify-content-between align-items-end"><div><div class="eyebrow">Your project</div><h2 class="section-title">Turn progress into a story people can follow.</h2></div><a class="btn-main mt-4 mt-lg-0" href="../contact/">Start a conversation</a></div></section></main><footer class="footer"><div class="container d-flex flex-column flex-md-row justify-content-between"><div>© Kith & Kin Creative</div><div class="footer-contact"><a href="mailto:kinkithcreative@gmail.com">kinkithcreative@gmail.com</a><a href="tel:+16044403463">604-440-3463</a></div></div></footer><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script></body></html>'''
          Path('construction-projects/index.html').write_text(construction)
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html martial-arts/index.html business-healthcare/index.html about/index.html contact/index.html construction-projects/index.html
          git commit -m "Add construction and public sector portfolio work" || exit 0
          git push
