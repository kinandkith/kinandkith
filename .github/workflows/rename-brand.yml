name: Rename brand to Kith & Kin

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  rename:
    if: github.event.head_commit.message != 'Rename brand to Kith & Kin'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename visible brand across site
        run: |
          find . -name '*.html' -type f -print0 | xargs -0 sed -i 's/Kin \& Kith/Kith \& Kin/g'
          find . -name '*.html' -type f -print0 | xargs -0 sed -i 's/KIN \& KITH/KITH \& KIN/g'
      - name: Commit changes
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Rename brand to Kith & Kin"
            git push
          fi
