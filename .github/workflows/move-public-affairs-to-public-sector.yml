name: Move public affairs videos to public sector

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/move-public-affairs-to-public-sector.yml'

permissions:
  contents: write

jobs:
  update-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move public affairs portfolio work
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          # Add public affairs / political communications work to Education & Public Sector.
          p = Path('education-public-sector/index.html')
          text = p.read_text()
          text = text.replace(
              'Story-driven video for schools, school districts, public organizations and community programs that need to communicate clearly with students, families, staff and the wider public.',
              'Story-driven video for schools, school districts, public organizations, elected officials and community programs that need to communicate clearly with students, families, stakeholders and the wider public.'
          )

          public_affairs = '''<section class="section pt-0"><div class="container"><div class="eyebrow">Public Affairs & Political Communications</div><h2 class="section-title mb-3">Clear stories for public audiences.</h2><p class="lead-copy mb-5">Public-facing communications work including MLA profiles and campaign storytelling, created to make people, priorities and messages easier for audiences to understand.</p><div class="row g-4"><div class="col-lg-4"><div class="ratio ratio-16x9"><iframe id="public-video-1" src="https://player.vimeo.com/video/477464504" title="Public affairs video example 1" allowfullscreen style="border:0;border-radius:22px;"></iframe></div><h3 id="public-title-1" class="mt-3" style="font-size:1.25rem;">Public Affairs Story 01</h3><p class="muted">Profile and public-facing communications focused on connecting an elected representative with the community.</p></div><div class="col-lg-4"><div class="ratio ratio-16x9"><iframe id="public-video-2" src="https://player.vimeo.com/video/477465575" title="Public affairs video example 2" allowfullscreen style="border:0;border-radius:22px;"></iframe></div><h3 id="public-title-2" class="mt-3" style="font-size:1.25rem;">Public Affairs Story 02</h3><p class="muted">Message-driven political communications created for a broad public audience.</p></div><div class="col-lg-4"><div class="ratio ratio-16x9"><iframe id="public-video-3" src="https://player.vimeo.com/video/769314108" title="Public affairs video example 3" allowfullscreen style="border:0;border-radius:22px;"></iframe></div><h3 id="public-title-3" class="mt-3" style="font-size:1.25rem;">Public Affairs Story 03</h3><p class="muted">Campaign storytelling that combines interviews, messaging and visual coverage to communicate clearly and authentically.</p></div></div></div></section>'''

          marker = '<section class="section section-dark">'
          if 'Public Affairs & Political Communications' not in text:
              text = text.replace(marker, public_affairs + marker, 1)

          old_js = "[[1,'education-video-1','education-title-1'],[2,'education-video-2','education-title-2'],[3,'education-video-3','education-title-3']]"
          new_js = "[[1,'education-video-1','education-title-1'],[2,'education-video-2','education-title-2'],[3,'education-video-3','education-title-3'],[4,'public-video-1','public-title-1'],[5,'public-video-2','public-title-2'],[6,'public-video-3','public-title-3']]"
          text = text.replace(old_js, new_js)
          text = text.replace(
              '<div class="col-md-3"><h4>Public Information</h4><p class="text-white-50">Turn complex information into clear, engaging video that people can understand and use.</p></div>',
              '<div class="col-md-3"><h4>Public Affairs</h4><p class="text-white-50">Profiles, campaign communications and public-facing stories built around clear messages.</p></div>'
          )
          p.write_text(text)

          # Remove the same public affairs videos from Business & Healthcare to avoid duplication.
          p = Path('business-healthcare/index.html')
          text = p.read_text()
          text = re.sub(r'<section class="section pt-0"><div class="container"><div class="eyebrow">Public Affairs & Campaign Communications</div>.*?</section>', '', text, count=1, flags=re.S)
          text = text.replace(
              '<div class="col-md-3"><h4>Public Affairs</h4><p class="text-white-50">Campaign, stakeholder and public-facing communications built around clear messages.</p></div>',
              '<div class="col-md-3"><h4>Corporate Teams</h4><p class="text-white-50">Internal communications, organizational stories and initiatives made clear.</p></div>'
          )
          p.write_text(text)
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add education-public-sector/index.html business-healthcare/index.html
          git commit -m "Move public affairs work to public sector portfolio" || exit 0
          git push
